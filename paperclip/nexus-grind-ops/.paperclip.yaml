schema: paperclip/v1
schemaVersion: 7
agents:
  watcher:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5-5
    budgetMonthlyCents: 500
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
          description: Read-only token for both repositories (Actions, Contents, Issues, Metadata)
  dispatcher:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5-5
    budgetMonthlyCents: 500
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
          description: Token for nexus-grind with Issues read/write, to keep the status board
  fixer:
    adapter:
      type: claude_local
      config:
        model: claude-opus-5-5
    budgetMonthlyCents: 3000
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
          description: Token for nexus-grind only, with Contents and Pull requests read/write
projects:
  nexus-grind-health:
    workspaces:
      nexus-grind:
        sourceType: git_repo
        repoUrl: https://github.com/ErikKarasek/nexus-grind
        defaultRef: main
        isPrimary: true
      nexus-grind-releases:
        sourceType: git_repo
        repoUrl: https://github.com/ErikKarasek/nexus-grind-releases
        defaultRef: main
routines:
  weekly-sweep:
    concurrencyPolicy: skip_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        cronExpression: "5 8 * * 1"
        timezone: Europe/Prague
